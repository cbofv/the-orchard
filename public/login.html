<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Orchard · Sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5ef; --ink: #1f2516; --ink-soft: rgba(31,37,22,.74); --ink-faint: rgba(31,37,22,.52);
  --line: rgba(60,72,30,.14); --card: rgba(255,255,251,.78); --edge: rgba(85,100,45,.18);
  --acc: #556b2f; --acc-ink: #fff; --grad: linear-gradient(135deg, #3c4d20 0%, #556b2f 55%, #74884a 100%);
  --soft: rgba(85,107,47,.1); --err: #b23a2e;
  --display: "Sora", system-ui, -apple-system, sans-serif;
  --body: "Manrope", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f110c; --ink: #eef0e6; --ink-soft: rgba(238,240,230,.74); --ink-faint: rgba(238,240,230,.5);
    --line: rgba(200,215,160,.12); --card: rgba(26,30,20,.78); --edge: rgba(180,200,130,.16);
    --acc: #a3b07a; --acc-ink: #10130b; --grad: linear-gradient(135deg, #7f9150 0%, #a3b07a 60%, #c4cf9c 100%);
    --soft: rgba(163,176,122,.12); --err: #ff8f84;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; min-height: 100%; display: grid; place-items: center; padding: 32px 16px;
  background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  background-image: radial-gradient(60vmax 50vmax at 15% 0%, var(--soft), transparent 70%), radial-gradient(50vmax 40vmax at 100% 100%, var(--soft), transparent 70%);
}
.wrap { width: 100%; max-width: 420px; }
.brand { text-align: center; margin-bottom: 28px; }
.mark { display: inline-block; width: 44px; height: 44px; margin-bottom: 14px; }
h1 { margin: 0; font: 300 2.4rem/1.1 var(--display); letter-spacing: -.02em; }
.tag { margin: 8px 0 0; color: var(--ink-faint); font-size: .95rem; }
.card { padding: 28px 24px 24px; border: 1px solid var(--edge); border-radius: 28px; background: var(--card); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); box-shadow: 0 20px 60px -30px rgba(31,37,22,.35); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 24px; border-radius: 999px; background: var(--soft); }
.tabs button { padding: 10px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); font: 600 .92rem var(--body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 10px -4px rgba(0,0,0,.25); }
form { display: grid; gap: 16px; }
form[hidden] { display: none; }
label { display: grid; gap: 6px; }
label span { font-size: .84rem; color: var(--ink-faint); letter-spacing: .01em; }
input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: transparent; color: var(--ink); font: 500 1rem var(--body); outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--soft); }
.primary { margin-top: 4px; padding: 14px; border: 0; border-radius: 999px; background: var(--grad); color: var(--acc-ink); font: 600 1rem var(--body); cursor: pointer; transition: transform .15s, opacity .2s; }
.primary:active { transform: scale(.98); }
.primary:disabled { opacity: .55; cursor: progress; }
.err { margin: 0; color: var(--err); font-size: .9rem; }
.err:empty { display: none; }
.note { margin: 18px 0 0; text-align: center; color: var(--ink-faint); font-size: .86rem; }
.note.ok { color: var(--acc); }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c4d20"/><stop offset="1" stop-color="#8da05c"/></linearGradient></defs><circle cx="24" cy="27" r="16" fill="url(#g)"/><path d="M24 11c0-4 2.5-6.5 6-7" stroke="#3c4d20" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M25 11c3-4 8-4 10-2-3 3-7 3-10 2z" fill="#74884a"/></svg>
    <h1>The Orchard</h1>
    <p class="tag">Your revision, grades and study time, in one place.</p>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-in" aria-selected="true" aria-controls="f-in">Sign in</button>
      <button type="button" role="tab" id="t-up" aria-selected="false" aria-controls="f-up">Create account</button>
    </div>

    <form id="f-in" aria-labelledby="t-in" novalidate>
      <label><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="err" role="alert"></p>
      <button class="primary" type="submit">Sign in</button>
    </form>

    <form id="f-up" aria-labelledby="t-up" novalidate hidden>
      <label><span>Your name</span><input type="text" name="name" autocomplete="name" maxlength="60" required></label>
      <label><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label>
      <p class="err" role="alert"></p>
      <button class="primary" type="submit">Create account</button>
    </form>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
(function () {
  var tabs = { in: document.getElementById("t-in"), up: document.getElementById("t-up") };
  var forms = { in: document.getElementById("f-in"), up: document.getElementById("f-up") };
  function pick(k) {
    Object.keys(tabs).forEach(function (n) { tabs[n].setAttribute("aria-selected", String(n === k)); forms[n].hidden = n !== k; });
    var first = forms[k].querySelector("input"); if (first) first.focus();
    history.replaceState(null, "", k === "up" ? "/signup" : "/login");
  }
  tabs.in.onclick = function () { pick("in"); };
  tabs.up.onclick = function () { pick("up"); };
  if (location.pathname === "/signup") pick("up"); else forms.in.querySelector("input").focus();
  if (/deleted=1/.test(location.search)) { var n = document.getElementById("note"); n.textContent = "Your account has been deleted."; n.className = "note ok"; }

  function submit(form, url, fields) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var err = form.querySelector(".err"), btn = form.querySelector(".primary"), body = {};
      fields.forEach(function (f) { body[f] = form.elements[f].value; });
      err.textContent = ""; btn.disabled = true;
      fetch(url, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-Orchard": "1" }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again."); }); })
        .then(function () { location.replace("/"); })
        .catch(function (x) { err.textContent = x.message === "Failed to fetch" ? "Couldn’t reach the server. Check your connection." : x.message; btn.disabled = false; });
    });
  }
  submit(forms.in, "/api/login", ["email", "password"]);
  submit(forms.up, "/api/signup", ["name", "email", "password"]);
})();
</script>
</body>
</html>
